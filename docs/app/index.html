<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RDO KKD Works</title>
  <!--
    The editable dashboard that lived here was retired: the sheet is read-only from the apps now.
    This page sends old bookmarks to the works viewer, after dropping the dashboard's saved sheet
    copy (it shares localStorage with the viewer, so it was eating the viewer's space). If the
    dashboard's service worker is still installed, it first has the browser fetch sw.js next to
    this file, which removes that worker and its cache. update() never registers anything new, so
    this cannot bring a worker back once it is gone.
  -->
  <script>
    try {
      ['wu.web.sheetCache.v1', 'wu.web.settings.v1', 'wu.editHistory.v1'].forEach(function (key) {
        window.localStorage.removeItem(key);
      });
    } catch (error) {}
    var leave = function () { window.location.replace('../works/'); };
    var sw = navigator.serviceWorker;
    if (sw && sw.controller) {
      sw.getRegistration().then(function (registration) { return registration && registration.update(); }).then(leave, leave);
      setTimeout(leave, 3000);
    } else {
      leave();
    }
  </script>
  <meta http-equiv="refresh" content="0; url=../works/">
</head>
<body>
  <p>The dashboard has moved to <a href="../works/">RDO KKD Works</a>.</p>
</body>
</html>
